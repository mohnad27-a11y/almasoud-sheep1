name: Build Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'admin-app/**'
      - '.github/workflows/admin-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Admin APK
        working-directory: admin-app
        run: gradle assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMasoud-Admin-APK
          path: admin-app/app/build/outputs/apk/debug/app-debug.apk