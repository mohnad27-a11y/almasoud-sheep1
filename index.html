<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المسعود</title>
<style>body{font-family:Arial;max-width:1000px;margin:auto;padding:20px;background:#f7f7f7}input,select,button{padding:10px;margin:4px}table{width:100%;border-collapse:collapse;background:white}td,th{border:1px solid #ddd;padding:8px}</style>
<h1>👨‍💼 لوحة إدارة شركة المسعود للأغنام</h1><form id="f"><input id="type" value="بلدي"><input id="price" type="number" placeholder="السعر"><input id="age" placeholder="العمر"><input id="weight" type="number" placeholder="الوزن"><label><input id="offer" type="checkbox"> عرض اليوم</label><input id="old" type="number" placeholder="السعر السابق"><button>إضافة رأس</button></form>
<table><thead><tr><th>الرقم</th><th>النوع</th><th>السعر</th><th>العمر</th><th>الوزن</th><th>العرض</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table>
<script>let sheep=JSON.parse(localStorage.getItem('almasoud_sheep')||'[]');function render(){rows.innerHTML=sheep.map(s=>`<tr><td>${s.id}</td><td>${s.type}</td><td>${s.price} ريال</td><td>${s.age}</td><td>${s.weight} كجم</td><td>${s.daily_offer?'نعم':'لا'}</td><td>${s.status}</td></tr>`).join('')}f.onsubmit=e=>{e.preventDefault();let n=sheep.length+1;sheep.push({id:'MS-'+String(n).padStart(4,'0'),type:type.value,price:+price.value,age:age.value,weight:+weight.value,status:'متوفر',daily_offer:offer.checked,old_price:+old.value||null});localStorage.setItem('almasoud_sheep',JSON.stringify(sheep));f.reset();type.value='بلدي';render()};render();</script></html>
