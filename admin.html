<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إدارة شركة المسعود للأغنام</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      color: #222;
    }

    header {
      background: #198754;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      color: #198754;
      font-size: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-main {
      width: 100%;
      margin-top: 8px;
      background: #198754;
      color: white;
    }

    .btn-edit {
      background: #ffc107;
      color: #222;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
    }

    .btn-refresh {
      background: #0d6efd;
      color: white;
      margin-bottom: 10px;
    }

    #message {
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
    }

    .product {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .product h3 {
      margin: 0 0 8px;
    }

    .product p {
      margin: 5px 0;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #d1e7dd;
      color: #0f5132;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>لوحة إدارة المسعود للأغنام</h1>
  <p>إدارة المنتجات والأسعار والمخزون</p>
</header>

<div class="container">

  <div class="card">
    <h2>إضافة رأس جديد</h2>

    <input
      id="productName"
      type="text"
      placeholder="اسم / نوع الرأس"
    >

    <select id="productCategory">
      <option value="">اختر التصنيف</option>
      <option value="بلدي">بلدي</option>
      <option value="حري">حري</option>
      <option value="تيوس">تيوس</option>
      <option value="طليان">طليان</option>
      <option value="رخال">رخال</option>
    </select>

    <input
      id="productNumber"
      type="text"
      placeholder="رقم الرأس"
    >

    <input
      id="productPrice"
      type="number"
      placeholder="السعر بالريال"
    >

    <input
      id="productStock"
      type="number"
      placeholder="الكمية / المخزون"
      value="1"
    >

    <button
      class="btn-main"
      onclick="addProduct()"
    >
      إضافة المنتج
    </button>

    <div id="message"></div>
  </div>

  <div class="card">
    <h2>المنتجات الحالية</h2>

    <button
      class="btn-refresh"
      onclick="loadProducts()"
    >
      تحديث المنتجات
    </button>

    <div id="productsBox">
      جاري تحميل المنتجات...
    </div>
  </div>

</div>

<script>

const API_BASE =
  "https://script.google.com/macros/s/AKfycbxSNDLVTFTAT7N-1Jiw3gfCvtAKod1ne8AMqELhXK1Y5evteBtr4ssarTLolw4bskc/exec";


function showMessage(text, error = false) {

  const box = document.getElementById("message");

  box.textContent = text;

  box.style.color =
    error ? "#dc3545" : "#198754";
}


async function loadProducts() {

  const box =
    document.getElementById("productsBox");

  box.innerHTML =
    "جاري تحميل المنتجات...";

  try {

    const response =
      await fetch(API_BASE);

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const data =
      await response.json();

    let products = [];

    if (Array.isArray(data)) {

      products = data;

    } else if (
      data &&
      Array.isArray(data.products)
    ) {

      products = data.products;

    } else if (
      data &&
      Array.isArray(data.data)
    ) {

      products = data.data;
    }


    if (!products.length) {

      box.innerHTML =
        '<div class="empty">لا توجد منتجات حاليًا</div>';

      return;
    }


    box.innerHTML = "";


    products.forEach((product, index) => {

      const id =
        product.id ||
        product._id ||
        product.number ||
        index;


      const card =
        document.createElement("div");

      card.className = "product";


      card.innerHTML = `
        <h3>
          ${escapeHtml(
            product.name ||
            product.productName ||
            "بدون اسم"
          )}
        </h3>

        <p>
          التصنيف:
          ${escapeHtml(
            product.category || "-"
          )}
        </p>

        <p>
          رقم الرأس:
          ${escapeHtml(
            product.number ||
            product.productNumber ||
            "-"
          )}
        </p>

        <p>
          السعر:
          <strong>
            ${escapeHtml(
              product.price || 0
            )} ريال
          </strong>
        </p>

        <p>
          المخزون:
          ${escapeHtml(
            product.stock ?? 1
          )}
        </p>

        <span class="status">
          متاح
        </span>

        <div class="actions">

          <button
            class="btn-edit"
            onclick='editProduct(
              ${JSON.stringify(id)},
              ${JSON.stringify(
                product.name ||
                product.productName ||
                ""
              )},
              ${JSON.stringify(
                product.price || 0
              )}
            )'
          >
            تعديل
          </button>

          <button
            class="btn-delete"
            onclick='deleteProduct(
              ${JSON.stringify(id)}
            )'
          >
            حذف
          </button>

        </div>
      `;


      box.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    box.innerHTML =
      '<div class="empty">تعذر تحميل المنتجات من الخادم</div>';
  }
}



async function addProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();

  const category =
    document
      .getElementById("productCategory")
      .value;

  const number =
    document
      .getElementById("productNumber")
      .value
      .trim();

  const price =
    document
      .getElementById("productPrice")
      .value;

  const stock =
    document
      .getElementById("productStock")
      .value;


  if (
    !name ||
    !category ||
    !number ||
    !price
  ) {

    showMessage(
      "أكمل جميع البيانات المطلوبة",
      true
    );

    return;
  }


  const product = {

    action: "add",

    name: name,

    category: category,

    number: number,

    price: Number(price),

    stock: Number(stock || 1)

  };


  try {

    showMessage(
      "جاري إضافة المنتج..."
    );


    await fetch(API_BASE, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(product)

    });


    showMessage(
      "تم إرسال المنتج بنجاح"
    );


    document
      .getElementById("productName")
      .value = "";

    document
      .getElementById("productCategory")
      .value = "";

    document
      .getElementById("productNumber")
      .value = "";

    document
      .getElementById("productPrice")
      .value = "";

    document
      .getElementById("productStock")
      .value = "1";


    setTimeout(
      loadProducts,
      1000
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "تعذر إضافة المنتج",
      true
    );
  }
}



async function deleteProduct(id) {

  const ok =
    confirm(
      "هل تريد حذف هذا المنتج؟"
    );

  if (!ok) return;


  try {

    await fetch(API_BASE, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify({
          action: "delete",
          id: id
        })

    });


    showMessage(
      "تم إرسال طلب الحذف"
    );


    setTimeout(
      loadProducts,
      1000
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "تعذر حذف المنتج",
      true
    );
  }
}



async function editProduct(
  id,
  oldName,
  oldPrice
) {

  const name =
    prompt(
      "اسم المنتج",
      oldName
    );

  if (name === null) return;


  const price =
    prompt(
      "السعر الجديد",
      oldPrice
    );

  if (price === null) return;


  try {

    await fetch(API_BASE, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify({

          action: "edit",

          id: id,

          name: name,

          price: Number(price)

        })

    });


    showMessage(
      "تم إرسال التعديل"
    );


    setTimeout(
      loadProducts,
      1000
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "تعذر تعديل المنتج",
      true
    );
  }
}



function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");
}



loadProducts();

</script>

</body>
</html>
